    <!-- Favicon — V12 symbol (public/favicon.svg). The URL is resolved from the
         served document's own path instead of a fixed relative href, because the
         same bundle is deployed twice: at the ROOT of a Vercel host (every deep
         route is rewritten to this file, so the icon must resolve to
         /favicon.svg from /services/topographie too) and under the /app/ GitHub
         Pages project path. Same rule as the router's detectBase() fallback —
         see src/router/index.tsx. -->
    <script>
      (function () {
        var path = location.pathname;
        var dir = path.slice(0, path.lastIndexOf("/") + 1);
        var base = path.slice(-1) === "/" || /\.html?$/i.test(path) ? dir : "/";
        var link = document.createElement("link");
        link.rel = "icon";
        link.type = "image/svg+xml";
        link.href = base + "favicon.svg";
        document.head.appendChild(link);
      })();
    </script>

    <!-- One superfamily, three languages: IBM Plex Sans (Latin) + IBM Plex Sans

    <link
